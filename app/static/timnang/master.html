<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tìm Nắng — Bảng điểm (Master)</title>
<!-- CSS Files -->
<link rel="stylesheet" href="/static/css/variables.css" />
<link rel="stylesheet" href="/static/css/components.css" />
<link rel="stylesheet" href="/static/css/game-timnang.css" />
</head>
<body>
<div id="stage">
  <div id="header">
    <h1>☀️ Tìm Nắng Cùng AI</h1>
    <div id="object">Bấm Bắt đầu để chơi</div>
    <div id="roundTag">vòng 0/6 · idle</div>
  </div>
  <div id="board"></div>

  <div id="winnerBanner"><div class="t"></div><div class="sub"></div></div>
  <div id="ranking"></div>
  <canvas id="confetti"></canvas>

  <div id="op">
    <button class="start" onclick="window.gameOp && window.gameOp('start')">▶ Bắt đầu</button>
    <button class="danger" onclick="window.gameOp && window.gameOp('restart')">↻ Chạy lại</button>
    <button onclick="window.gameOp && window.gameOp('skip_round')">⏭ Bỏ qua vòng</button>
    <button onclick="window.gameOp && window.gameOp('next_round')">⏭ Vòng kế</button>
    <div class="group" id="teamOps"></div>
  </div>
</div>

<audio id="player" preload="auto"></audio>

<!-- Game JavaScript Module -->
<script type="module" src="/static/js/game-timnang.js"></script>
</body>
</html>
