# CI — enterprise gate: lint (ruff) + type check (mypy) + test (pytest) trên mọi push/PR.
# KHÔNG cần Kokoro submodule (2GB) — pytest/mypy chạy với Kokoro vắng (TTS_AVAILABLE=False).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # Kokoro submodule không cần cho CI

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Ruff (lint)
        run: ruff check app/ tests/

      - name: Mypy (type check)
        run: mypy app/core app/games app/schemas app/koon_data.py app/timnang_data.py

      - name: Pytest
        run: pytest tests/ -q
