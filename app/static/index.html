<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cùng Koon Đi Tìm Cầu Vồng 🌈</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/game-rainbow.css">

  <style>
    /* Rainbow colors (JavaScript will reference these) */
    :root {
      --rainbow-1: #FF6B6B;
      --rainbow-2: #FFA500;
      --rainbow-3: #FFD93D;
      --rainbow-4: #6BCF7F;
      --rainbow-5: #4ECDC4;
      --rainbow-6: #A78BFA;
      --rainbow-7: #F06595;
    }
  </style>

  <!-- Live2D Libraries -->
  <script src="/static/libs/pixi.min.js"></script>
  <script src="/static/libs/cubism4.min.js"></script>
  <script src="/static/libs/live2dcubismcore.min.js"></script>
</head>
<body>
  <!-- Start Overlay -->
  <div id="startOverlay">
    <h1>🌈 Cùng Koon Đi Tìm Cầu Vồng 🌈</h1>
    <button class="btn-primary btn-xl" onclick="window.startGame && window.startGame()">▶ Bắt đầu</button>
  </div>

  <!-- Main Stage -->
  <div id="stage">
    <!-- Left Column: Questions + Progress -->
    <div id="leftCol">
      <div id="phaseHeader">
        <span id="phaseTag"></span>
        <button id="diagBtn" onclick="window.toggleDiag && window.toggleDiag()">🔧 Diagnostics</button>
      </div>

      <div id="questionBox">
        <div id="question" class="bubble"></div>
      </div>

      <div id="status"></div>
      <div id="sttHeard" class="stt-heard"></div>

      <div id="answerBar">
        <input type="text" id="answerText" placeholder="Nhập đáp án..." autocomplete="off">
        <button id="mic" class="btn-secondary" onclick="window.toggleMic && window.toggleMic()">🎤 Mic</button>
      </div>

      <div id="progressBar"></div>

      <!-- Test Mic Section -->
      <div id="testMicBox">
        <button id="testBtn" onclick="window.toggleTestMic && window.toggleTestMic()">🎤 Test mic</button>
        <div id="testOut"></div>
      </div>
    </div>

    <!-- Right Column: Rainbow + KOON -->
    <div id="rightCol">
      <div id="koon">
        <canvas id="koonCanvas"></canvas>
        <div id="koonEmoji">🦊</div>
      </div>

      <svg id="rainbow" viewBox="0 0 700 380"></svg>

      <div id="finale"></div>
    </div>
  </div>

  <!-- Recap Video/Overlay Layer -->
  <div id="recapVideo">
    <div id="rvControls">
      <button id="rvPlay">▶</button>
      <input type="range" id="rvSeek" min="0" max="1000" value="0">
      <span id="rvTime">0:00 / 0:00</span>
      <button id="rvMute">🔊</button>
    </div>
  </div>

  <div id="recapOverlay"></div>

  <!-- Effects Layer -->
  <canvas id="confettiCanvas"></canvas>
  <canvas id="magicCanvas"></canvas>
  <div id="flash"></div>
  <div id="stars"></div>

  <!-- Diagnostics Panel -->
  <div id="diag">
    <div id="engines"></div>
  </div>

  <audio id="player" preload="auto"></audio>

  <!-- Game JavaScript Module -->
  <script type="module" src="/static/js/game-rainbow.js"></script>
</body>
</html>
